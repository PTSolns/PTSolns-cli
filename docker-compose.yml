version: '3.8'

services:
  builder:
    image: golang:1.24.4
    working_dir: /app
    volumes:
      - .:/app
      - ./downloads:/app/downloads
    command: >
      bash -c "
        go mod download &&
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -buildvcs=false -o ptsolns-cli . &&
        mkdir -p downloads &&
        mv ptsolns-cli downloads/ptsolns-cli
      "
